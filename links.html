<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>AM-369-Network</title>
  <meta name="description" content="AM-369-Network — Unified Access Point"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ════════════════════════════════════════
   AM-369-Network — DARK GLASS ELECTRIC
   ════════════════════════════════════════ */

:root{
  --nc-a:#00e5ff;
  --nc-b:#7b2fff;
  --nc-glow-a:rgba(0,229,255,0.55);
  --nc-glow-b:rgba(123,47,255,0.35);
  --nc-glow-sm:rgba(0,229,255,0.2);
  --nc-text:#e0f7ff;
  --nc-muted:rgba(160,220,255,0.5);
  --nc-card:rgba(4,8,20,0.72);
  --nc-border:rgba(0,229,255,0.45);
  --pulse-dur:4s;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}

#bgCanvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;}
#sparkCanvas{position:fixed;inset:0;z-index:5;pointer-events:none;width:100%;height:100%;}

body{
  font-family:'Space Grotesk',sans-serif;
  color:var(--nc-text);
  overflow-x:hidden;
  min-height:100vh;
  background:#020510;
}

@keyframes pageUp{
  0%{opacity:0;transform:translateY(22px);}
  100%{opacity:1;transform:translateY(0);}
}
.wrap{
  position:relative;z-index:10;
  width:min(560px,calc(100vw - 32px));
  margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) 0 56px;
  animation:pageUp .6s cubic-bezier(0.22,1,0.36,1) .1s both;
}

/* ── HERO ── */
.hero{text-align:center;padding:12px 12px 28px;position:relative;}
.hero::before{
  content:'';display:block;width:50%;height:1px;
  margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,var(--nc-a) 40%,var(--nc-b) 60%,transparent);
  opacity:0.6;
}
.hero::after{
  content:'';display:block;width:30%;height:1px;
  margin:18px auto 0;
  background:linear-gradient(90deg,transparent,var(--nc-b) 40%,var(--nc-a) 60%,transparent);
  opacity:0.35;
}

@keyframes electricShimmer{
  0%  {background-position:0% center;}
  100%{background-position:600% center;}
}
@keyframes titleGlitch{
  0%,88%,100%{text-shadow:0 0 4px var(--nc-a),0 0 12px var(--nc-glow-a);}
  89%{text-shadow:2px 0 0 rgba(0,255,255,.4),-2px 0 0 rgba(180,0,255,.4),0 0 8px var(--nc-a);}
  90%{text-shadow:-2px 0 0 rgba(0,200,255,.5),2px 0 0 rgba(200,0,255,.5);}
  92%{text-shadow:0 0 4px var(--nc-a),0 0 12px var(--nc-glow-a);}
  94%{text-shadow:2px 0 0 rgba(0,255,200,.3),-2px 0 0 rgba(255,0,150,.3),0 0 8px var(--nc-a);}
  97%{text-shadow:0 0 4px var(--nc-a),0 0 12px var(--nc-glow-a);}
}
.hero-name{
  font-family:'New Rocker',cursive;
  font-size:clamp(26px,8vw,54px);
  font-weight:400;
  letter-spacing:clamp(1px,.8vw,4px);
  line-height:1.1;
  margin-bottom:10px;
  white-space:nowrap;
  transform-origin:center top;
  background:linear-gradient(110deg,
    #003380  0%,
    #0066cc  3%,
    #00aaff  6%,
    #00e5ff  9%,
    #40ffee  12%,
    #ffffff  15%,
    #ffe000  18%,
    #ff8800  21%,
    #ff2266  24%,
    #cc00ff  27%,
    #7700ff  30%,
    #0033ff  33%,
    #00aaff  36%,
    #00ffcc  39%,
    #39ff14  42%,
    #ffffff  45%,
    #ffff00  48%,
    #ff6600  51%,
    #ff0066  54%,
    #aa00ff  57%,
    #4400ff  60%,
    #0077ff  63%,
    #00ddff  66%,
    #80ffee  69%,
    #ffffff  72%,
    #ffd700  75%,
    #ff3300  78%,
    #ff00aa  81%,
    #8800ff  84%,
    #0055ff  87%,
    #00ccff  90%,
    #00ffdd  93%,
    #ffffff  96%,
    #003380  100%
  );
  background-size:600% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:electricShimmer 8s linear infinite, titleGlitch 7s ease-in-out infinite;
  filter:drop-shadow(0 0 3px rgba(0,200,255,.25));
}

/* Dr. Ankit Malik — sparking neon white tube light */
@keyframes sparkTube{
  0%   {opacity:1;  text-shadow:0 0 4px #fff,0 0 12px #fff,0 0 24px rgba(180,230,255,.9),0 0 50px rgba(100,200,255,.6),0 0 90px rgba(0,150,255,.3);}
  5%   {opacity:.7; text-shadow:0 0 2px #ddd,0 0 6px rgba(200,230,255,.5);}
  5.4% {opacity:1;  text-shadow:0 0 5px #fff,0 0 16px #fff,0 0 32px rgba(180,230,255,1),0 0 65px rgba(100,200,255,.8);}
  5.8% {opacity:.3; text-shadow:0 0 1px #aaa;}
  6.2% {opacity:1;  text-shadow:0 0 4px #fff,0 0 14px #fff,0 0 28px rgba(180,230,255,.95),0 0 55px rgba(100,200,255,.65);}
  45%  {opacity:1;  text-shadow:0 0 4px #fff,0 0 12px #fff,0 0 24px rgba(180,230,255,.9),0 0 50px rgba(100,200,255,.6);}
  58%  {opacity:.88;text-shadow:0 0 3px #fff,0 0 9px rgba(200,230,255,.7);}
  58.5%{opacity:1;  text-shadow:0 0 5px #fff,0 0 15px #fff,0 0 30px rgba(180,230,255,.95);}
  82%  {opacity:.1; text-shadow:0 0 1px #888;}
  82.4%{opacity:1;  text-shadow:0 0 5px #fff,0 0 18px #fff,0 0 38px rgba(180,230,255,1),0 0 75px rgba(100,200,255,.9);}
  82.9%{opacity:.6; text-shadow:0 0 2px #ccc,0 0 8px rgba(200,230,255,.5);}
  83.4%{opacity:1;  text-shadow:0 0 4px #fff,0 0 14px #fff,0 0 28px rgba(180,230,255,.9),0 0 55px rgba(100,200,255,.65);}
  100% {opacity:1;  text-shadow:0 0 4px #fff,0 0 12px #fff,0 0 24px rgba(180,230,255,.9),0 0 50px rgba(100,200,255,.6),0 0 90px rgba(0,150,255,.3);}
}
.hero-subtitle{
  font-family:'New Rocker',cursive;
  font-size:clamp(16px,4.5vw,26px);
  font-weight:400;letter-spacing:2px;
  color:#ffffff;margin-bottom:8px;
  animation:sparkTube 7s ease-in-out infinite;
}
.tagline{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(11px,2.5vw,13px);
  font-weight:300;letter-spacing:3px;
  text-transform:uppercase;
  color:var(--nc-muted);opacity:.8;
}

/* ── GLASS CARDS ── */
.glass-card{
  margin:14px 0;position:relative;
  border-radius:14px;overflow:visible;
  background:var(--nc-card);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--nc-border);
  box-shadow:0 0 0 1px rgba(0,0,0,.8),0 0 20px var(--nc-glow-sm),0 0 60px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.4);
  will-change:box-shadow;
  animation:cardPulse var(--pulse-dur,4s) ease-in-out infinite;
}
/* Electric current trace along top */
.glass-card::before{
  content:'';position:absolute;
  top:-1px;left:10%;right:10%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,
    transparent 0%,var(--nc-b) 20%,var(--nc-a) 40%,
    #fff 50%,var(--nc-a) 60%,var(--nc-b) 80%,transparent 100%
  );
  background-size:200% auto;
  animation:currentFlow 2.5s linear infinite;
  opacity:.85;z-index:2;
}
@keyframes currentFlow{
  0%  {background-position:-200% center;opacity:.3;}
  20% {opacity:.95;}
  50% {background-position:0% center;opacity:1;}
  80% {opacity:.9;}
  100%{background-position:200% center;opacity:.3;}
}
.glass-card::after{
  content:'';position:absolute;
  bottom:-1px;right:-1px;width:32px;height:32px;
  background:radial-gradient(circle at 100% 100%,rgba(0,229,255,.3) 0%,transparent 70%);
  border-radius:0 0 14px 0;pointer-events:none;
}
@keyframes cardPulse{
  0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.8),0 0 16px var(--nc-glow-sm),0 0 50px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.4);}
  50%{box-shadow:0 0 0 1px rgba(0,0,0,.8),0 0 30px var(--nc-glow-a),0 0 70px var(--nc-glow-b),
    0 0 100px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.4);}
}
.card-content{padding:18px 16px;position:relative;z-index:1;}

/* ── SECTION LABEL ── */
.section-label{
  font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;
  letter-spacing:6px;text-transform:uppercase;color:var(--nc-a);
  margin-bottom:14px;display:flex;align-items:center;gap:10px;opacity:.8;
  text-shadow:none !important;animation:none !important;
}
.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,229,255,.4),transparent);}

/* ── LINK BUTTONS ── */
.link-list{display:flex;flex-direction:column;gap:7px;}
.link-btn{
  display:flex;align-items:center;gap:12px;
  text-decoration:none;color:var(--nc-text);
  padding:11px 13px;border-radius:9px;
  position:relative;overflow:hidden;
  background:rgba(0,10,30,.6);
  border:1px solid rgba(0,229,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 -1px 0 rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.4);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease,color .22s ease;
  -webkit-tap-highlight-color:transparent;
  user-select:none;outline:none;
  text-shadow:none !important;animation:none !important;
}
.link-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 25%,rgba(0,229,255,.07) 48%,rgba(123,47,255,.05) 55%,transparent 75%);
  transform:translateX(-100%);transition:transform .4s ease;
}
.link-btn:hover::before{transform:translateX(100%);}
.link-btn:hover{
  border-color:rgba(0,229,255,.5);background:rgba(0,20,50,.75);
  box-shadow:inset 0 1px 0 rgba(0,229,255,.08),inset 0 -1px 0 rgba(0,0,0,.3),
    0 4px 16px rgba(0,0,0,.5),0 0 16px rgba(0,229,255,.18),0 0 35px rgba(123,47,255,.1);
  transform:translateY(-1px);color:#fff;
}
.link-btn:active{transform:translateY(0);opacity:.82;}

.link-ico{
  width:32px;height:32px;border-radius:6px;
  display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;
  flex-shrink:0;color:var(--nc-a);
  background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .22s ease,background .22s ease,color .22s ease;
  text-shadow:none !important;animation:none !important;
}
.link-btn:hover .link-ico{
  background:rgba(0,229,255,.18);border-color:rgba(0,229,255,.6);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 10px rgba(0,229,255,.4);
}
.link-txt{
  font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:500;
  letter-spacing:.3px;transition:color .22s ease;
  text-shadow:none !important;animation:none !important;
}

/* FEATURED */
@keyframes featuredPulse{
  0%,100%{box-shadow:inset 0 1px 0 rgba(0,229,255,.1),inset 0 -1px 0 rgba(0,0,0,.35),
    0 5px 20px rgba(0,0,0,.55),0 0 22px rgba(0,229,255,.2),0 0 50px rgba(123,47,255,.1);}
  50%{box-shadow:inset 0 1px 0 rgba(0,229,255,.18),inset 0 -1px 0 rgba(0,0,0,.35),
    0 5px 20px rgba(0,0,0,.55),0 0 38px rgba(0,229,255,.38),0 0 90px rgba(123,47,255,.2);}
}
.link-btn.featured-btn{
  padding:14px 13px;background:rgba(0,15,40,.82);
  border-color:rgba(0,229,255,.6);
  animation:featuredPulse 3.5s ease-in-out infinite !important;
}
.link-btn.featured-btn .link-ico{
  background:rgba(0,229,255,.2);border-color:rgba(0,229,255,.65);color:#fff;
  width:35px;height:35px;font-size:14px;box-shadow:0 0 12px rgba(0,229,255,.4);
}
.link-btn.featured-btn .link-txt{
  font-size:15px;font-weight:600;color:#e8f8ff;text-shadow:none !important;
}

.skeleton{
  color:var(--nc-muted);font-size:13px;padding:10px 4px;
  font-style:italic;font-family:'Space Grotesk',sans-serif;
  animation:none !important;
}
.foot{
  margin-top:26px;text-align:center;
  font-family:'Space Grotesk',sans-serif;font-size:9px;
  letter-spacing:4px;color:var(--nc-muted);opacity:.45;
  text-transform:uppercase;animation:none !important;
}

/* ── 10 NEON PALETTES ── */
.neon-cyan    {--nc-a:#00e5ff;--nc-b:#7b2fff;--nc-glow-a:rgba(0,229,255,.5);--nc-glow-b:rgba(123,47,255,.3);--nc-glow-sm:rgba(0,229,255,.18);--nc-border:rgba(0,229,255,.42);--pulse-dur:4s;}
.neon-violet  {--nc-a:#c040ff;--nc-b:#4060ff;--nc-glow-a:rgba(192,64,255,.5);--nc-glow-b:rgba(64,96,255,.3);--nc-glow-sm:rgba(192,64,255,.18);--nc-border:rgba(192,64,255,.42);--pulse-dur:3.5s;}
.neon-lime    {--nc-a:#39ff14;--nc-b:#00d4ff;--nc-glow-a:rgba(57,255,20,.5);--nc-glow-b:rgba(0,212,255,.3);--nc-glow-sm:rgba(57,255,20,.15);--nc-border:rgba(57,255,20,.4);--pulse-dur:5s;}
.neon-magenta {--nc-a:#ff00c8;--nc-b:#7700ff;--nc-glow-a:rgba(255,0,200,.5);--nc-glow-b:rgba(119,0,255,.3);--nc-glow-sm:rgba(255,0,200,.18);--nc-border:rgba(255,0,200,.42);--pulse-dur:3s;}
.neon-orange  {--nc-a:#ff6600;--nc-b:#ff00aa;--nc-glow-a:rgba(255,102,0,.5);--nc-glow-b:rgba(255,0,170,.3);--nc-glow-sm:rgba(255,102,0,.18);--nc-border:rgba(255,102,0,.42);--pulse-dur:4.5s;}
.neon-ice     {--nc-a:#a0f0ff;--nc-b:#5080ff;--nc-glow-a:rgba(160,240,255,.5);--nc-glow-b:rgba(80,128,255,.3);--nc-glow-sm:rgba(160,240,255,.18);--nc-border:rgba(160,240,255,.4);--pulse-dur:6s;}
.neon-gold    {--nc-a:#ffd700;--nc-b:#ff6600;--nc-glow-a:rgba(255,215,0,.5);--nc-glow-b:rgba(255,102,0,.3);--nc-glow-sm:rgba(255,215,0,.18);--nc-border:rgba(255,215,0,.42);--pulse-dur:5.5s;}
.neon-red     {--nc-a:#ff1a4b;--nc-b:#ff6600;--nc-glow-a:rgba(255,26,75,.5);--nc-glow-b:rgba(255,102,0,.3);--nc-glow-sm:rgba(255,26,75,.18);--nc-border:rgba(255,26,75,.42);--pulse-dur:2.8s;}
.neon-teal    {--nc-a:#00ffcc;--nc-b:#0066ff;--nc-glow-a:rgba(0,255,204,.5);--nc-glow-b:rgba(0,102,255,.3);--nc-glow-sm:rgba(0,255,204,.18);--nc-border:rgba(0,255,204,.42);--pulse-dur:4.2s;}
.neon-white   {--nc-a:#e8f4ff;--nc-b:#80a0ff;--nc-glow-a:rgba(232,244,255,.5);--nc-glow-b:rgba(128,160,255,.3);--nc-glow-sm:rgba(232,244,255,.18);--nc-border:rgba(232,244,255,.4);--pulse-dur:7s;}

@media(max-width:480px){.hero-name{letter-spacing:1px;}.link-txt{font-size:13px;}.card-content{padding:14px 12px;}}
@media(prefers-reduced-motion:reduce){.hero-name,.hero-subtitle,.glass-card,.link-btn.featured-btn{animation:none !important;}}
*{-webkit-tap-highlight-color:transparent;}
a,button{outline:none;}
  </style>
</head>

<!-- RANDOM NEON PALETTE ON LOAD -->
<script>
(() => {
  const P = ['neon-cyan','neon-violet','neon-lime','neon-magenta','neon-orange',
             'neon-ice','neon-gold','neon-red','neon-teal','neon-white'];
  const pick = P[Math.floor(Math.random() * P.length)];
  document.querySelectorAll('.glass-card').forEach(c => c.classList.add(pick));
})();
</script>

<!-- ANIMATED BG — orbs + hex grid -->
<script>
(() => {
  const cv = document.getElementById('bgCanvas');
  const cx = cv.getContext('2d', {alpha:false});
  let W, H;
  function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  let t = 0;
  const orbs = [0,1,2,3,4].map((i) => ({
    x: 0, y: 0,
    r: 90 + Math.random()*110,
    vx: (Math.random()-.5)*.28,
    vy: (Math.random()-.5)*.18,
    hue: [195,260,175,300,215][i],
    ph: Math.random()*Math.PI*2
  }));
  // init positions after W/H known
  orbs.forEach((o,i) => { o.x=W*(0.1+i*0.22); o.y=H*(0.2+Math.random()*.6); });

  // Pre-draw hex grid to offscreen canvas — only once
  let hexCache = null, hexW = 0, hexH2 = 0;
  function buildHex(){
    hexW = W; hexH2 = H;
    const oc = (typeof OffscreenCanvas!=='undefined') ? new OffscreenCanvas(W,H) : (() => {const c=document.createElement('canvas');c.width=W;c.height=H;return c;})();
    const oc2 = oc.getContext('2d');
    const sz=28, hh=sz*Math.sqrt(3);
    oc2.strokeStyle='rgba(0,180,255,0.06)';oc2.lineWidth=0.5;
    const cols=Math.ceil(W/(sz*1.5))+2, rows=Math.ceil(H/hh)+2;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=c*sz*1.5-sz, y=r*hh+(c%2===0?0:hh/2)-hh;
      oc2.beginPath();
      for(let a=0;a<6;a++){const ag=Math.PI/3*a-Math.PI/6;oc2.lineTo(x+sz*.9*Math.cos(ag),y+sz*.9*Math.sin(ag));}
      oc2.closePath();oc2.stroke();
    }
    hexCache = oc;
  }

  function loop(){
    t+=.007;
    cx.fillStyle='#020510'; cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation='screen';

    for(const o of orbs){
      o.x+=o.vx+Math.sin(t*.7+o.ph)*.25;
      o.y+=o.vy+Math.cos(t*.5+o.ph)*.18;
      if(o.x<-o.r)o.x=W+o.r; if(o.x>W+o.r)o.x=-o.r;
      if(o.y<-o.r)o.y=H+o.r; if(o.y>H+o.r)o.y=-o.r;
      const pulse=.5+Math.sin(t*1.2+o.ph)*.5;
      const g=cx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*(.8+pulse*.4));
      g.addColorStop(0,`hsla(${o.hue},100%,70%,${.055+pulse*.035})`);
      g.addColorStop(.5,`hsla(${o.hue},100%,50%,${.022+pulse*.012})`);
      g.addColorStop(1,'hsla(0,0%,0%,0)');
      cx.fillStyle=g; cx.fillRect(0,0,W,H);
    }

    cx.globalCompositeOperation='source-over';
    if(!hexCache || hexW!==W || hexH2!==H) buildHex();
    cx.drawImage(hexCache,0,0);

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

<!-- ELECTRIC SPARKS ENTRY -->
<script>
(() => {
  const cv = document.getElementById('sparkCanvas');
  const cx = cv.getContext('2d');
  let W, H;
  function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const sparks = Array.from({length:55}, () => ({
    x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:0,hue:0,grav:0
  }));
  function initSpark(s, fromBottom=false){
    s.x=W*(.05+Math.random()*.9);
    s.y=fromBottom?H+Math.random()*H*.4 : H*(.3+Math.random()*.7);
    s.vx=(Math.random()-.5)*5;
    s.vy=-(3+Math.random()*7);
    s.life=fromBottom?Math.random()*40:0;
    s.maxLife=28+Math.random()*48;
    s.size=.5+Math.random()*1.8;
    s.hue=Math.random()<.5?195:260;
    s.grav=.035+Math.random()*.04;
  }
  sparks.forEach(s=>initSpark(s,true));

  const start=performance.now();
  function loop(now){
    const elapsed=now-start;
    const alpha=Math.max(0,1-(elapsed-500)/1600);
    if(alpha<=0){cv.style.display='none';return;}
    cv.style.opacity=alpha;
    cx.clearRect(0,0,W,H);
    cx.globalCompositeOperation='screen';
    for(const s of sparks){
      s.life++;
      s.vx+=(Math.random()-.5)*.28; s.vy+=s.grav; s.vx*=.98;
      s.x+=s.vx; s.y+=s.vy;
      if(s.life>=s.maxLife||s.y<-10) initSpark(s,false);
      const p=s.life/s.maxLife, a=Math.max(0,1-p*1.1);
      if(a<.01) continue;
      cx.globalAlpha=a*(.6+Math.sin(s.life*.9)*.4);
      cx.beginPath(); cx.arc(s.x,s.y,s.size,0,Math.PI*2);
      cx.fillStyle=`hsl(${s.hue},100%,75%)`;
      cx.shadowBlur=8; cx.shadowColor=`hsl(${s.hue},100%,60%)`;
      cx.fill();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<!-- FIT TITLE -->
<script>
(function fitTitle(){
  const el=document.querySelector('.hero-name');
  if(!el) return;
  const parent=el.closest('.hero')||el.parentElement;
  function scale(){
    el.style.transform='none';
    requestAnimationFrame(()=>{
      const avail=parent.clientWidth-24, nat=el.scrollWidth;
      if(nat>0&&nat>avail){ el.style.transform=`scaleX(${(avail/nat).toFixed(4)})`; el.style.transformOrigin='center top'; }
    });
  }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(scale);
  else setTimeout(scale,300);
  window.addEventListener('resize',scale);
})();
</script>

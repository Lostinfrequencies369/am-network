<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AM-369-Network</title>
  <meta name="description" content="AM-369-Network — Unified Access Point" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="wrap">

    <!-- HERO -->
    <header class="hero">
      <h1 class="hero-name">Dr. ANKIT MALIK</h1>
      <p class="tagline">AM-369-Network — Unified Access Point</p>
    </header>

    <!-- FEATURED -->
    <section class="wood-card mood-amber" id="featuredCard">
      <div class="card-content">
        <h3 class="section-label">Featured</h3>
        <div class="link-list">
          <a class="link-btn featured-btn" id="featuredBtn" href="#" target="_blank" rel="noopener">
            <span class="link-ico">★</span>
            <span class="link-txt">Loading…</span>
          </a>
        </div>
      </div>
    </section>

    <!-- LINKS -->
    <section class="wood-card mood-amber" id="linksCard">
      <div class="card-content">
        <h3 class="section-label">Links</h3>
        <div class="link-list" id="linksList">
          <div class="skeleton">Loading links…</div>
        </div>
      </div>
    </section>

    <div class="foot">© <span id="yr"></span> AM-369-Network</div>

  </main>

  <script src="script.js"></script>

  <!-- MOOD CYCLING ENGINE — warm wood tones -->
  <script>
    (() => {
      const MOODS = [
        'mood-amber','mood-copper','mood-bronze','mood-antique',
        'mood-mahogany','mood-teak','mood-rosewood','mood-ebony',
        'mood-walnut','mood-cedar','mood-oak','mood-pine'
      ];

      const ALL_MOODS = MOODS.join(' ');
      const cards = document.querySelectorAll('.wood-card');
      let current = 0;

      function applyMood(idx) {
        cards.forEach(card => {
          card.classList.remove(...MOODS);
          card.classList.add(MOODS[idx]);
        });
      }

      function next() {
        let n;
        do { n = Math.floor(Math.random() * MOODS.length); } while (n === current);
        current = n;
        applyMood(current);
        // Random hold 5s–16s
        setTimeout(next, 5000 + Math.random() * 11000);
      }

      applyMood(0);
      setTimeout(next, 4000);
    })();
  </script>

</body>
</html>

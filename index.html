<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM-369-Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

@property --angle-1 {
  syntax: "<angle>";
  inherits: false;
  initial-value: -75deg;
}
@property --angle-2 {
  syntax: "<angle>";
  inherits: false;
  initial-value: -45deg;
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

body, html, #app {
  width: 100%; height: 100%;
}

body {
  touch-action: none;
  background: #0a0805;
  overflow: hidden;
  font-family: "Montserrat", sans-serif;
  -webkit-font-smoothing: antialiased;
}

#app {
  height: 100%;
  position: relative;
}

#canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* ── HERO ─────────────────────────────────────── */
.hero {
  position: relative;
  z-index: 10;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  pointer-events: none;
  padding: 24px;
}

.welcome-text {
  font-size: clamp(11px, 2.8vw, 15px);
  font-weight: 500;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  text-shadow: 0 0 20px rgba(0,0,0,1);
  margin-bottom: 2px;
}

.hero-name {
  font-size: clamp(34px, 9vw, 68px);
  font-weight: 700;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 0 40px rgba(0,0,0,1), 0 0 80px rgba(0,0,0,0.5);
  line-height: 1.05;
  text-align: center;
  letter-spacing: 3px;
}

.hero-sub {
  font-size: clamp(16px, 4.5vw, 26px);
  font-weight: 600;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.48);
  text-shadow: 0 0 20px rgba(0,0,0,1);
  margin-top: 4px;
  margin-bottom: 28px;
}

/* ── BUTTON ───────────────────────────────────── */
:root {
  --global--size: clamp(1rem, 2.5vw, 1.4rem);
  --anim--hover-time: 400ms;
  --anim--hover-ease: cubic-bezier(0.25, 1, 0.5, 1);
}

.button-wrap {
  position: relative;
  z-index: 2;
  border-radius: 999vw;
  background: transparent;
  pointer-events: auto;
  transition: all var(--anim--hover-time) var(--anim--hover-ease);
  font-size: var(--global--size);
}

.button-shadow {
  --shadow-cuttoff-fix: 2em;
  position: absolute;
  width: calc(100% + var(--shadow-cuttoff-fix));
  height: calc(100% + var(--shadow-cuttoff-fix));
  top: calc(0% - var(--shadow-cuttoff-fix) / 2);
  left: calc(0% - var(--shadow-cuttoff-fix) / 2);
  filter: blur(clamp(2px, 0.125em, 12px));
  overflow: visible;
  pointer-events: none;
}

.button-shadow::after {
  content: "";
  position: absolute;
  z-index: 0;
  inset: 0;
  border-radius: 999vw;
  background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.18));
  width: calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
  height: calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
  top: calc(var(--shadow-cuttoff-fix) - 0.5em);
  left: calc(var(--shadow-cuttoff-fix) - 0.875em);
  padding: 0.125em;
  box-sizing: border-box;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  transition: all var(--anim--hover-time) var(--anim--hover-ease);
  opacity: 1;
}

.enter-btn {
  --border-width: clamp(1px, 0.0625em, 4px);
  all: unset;
  cursor: pointer;
  position: relative;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  pointer-events: auto;
  z-index: 3;
  background: linear-gradient(
    -75deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.25),
    rgba(255,255,255,0.08)
  );
  border-radius: 999vw;
  box-shadow:
    inset 0 0.125em 0.125em rgba(0,0,0,0.08),
    inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
    0 0.25em 0.125em -0.125em rgba(0,0,0,0.3),
    0 0 0.1em 0.25em inset rgba(255,255,255,0.2),
    0 0 0 0 rgba(255,255,255,1);
  backdrop-filter: blur(clamp(1px, 0.125em, 4px));
  -webkit-backdrop-filter: blur(clamp(1px, 0.125em, 4px));
  transition: all var(--anim--hover-time) var(--anim--hover-ease);
}

.enter-btn:hover {
  transform: scale(0.975);
  box-shadow:
    inset 0 0.125em 0.125em rgba(0,0,0,0.05),
    inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
    0 0.15em 0.05em -0.1em rgba(0,0,0,0.3),
    0 0 0.05em 0.1em inset rgba(255,255,255,0.5),
    0 0 0 0 rgba(255,255,255,1);
}

.enter-btn span {
  position: relative;
  display: block;
  user-select: none;
  font-family: "Montserrat", sans-serif;
  letter-spacing: 0.08em;
  font-weight: 600;
  font-size: 1em;
  color: rgba(255,255,255,0.92);
  text-shadow: 0em 0.1em 0.2em rgba(0,0,0,0.5);
  transition: all var(--anim--hover-time) var(--anim--hover-ease);
  padding-inline: 2em;
  padding-block: 0.9em;
}

.enter-btn:hover span {
  text-shadow: 0.025em 0.025em 0.025em rgba(0,0,0,0.3);
}

.enter-btn span::after {
  content: "";
  display: block;
  position: absolute;
  z-index: 3;
  width: calc(100% - var(--border-width));
  height: calc(100% - var(--border-width));
  top: calc(0% + var(--border-width) / 2);
  left: calc(0% + var(--border-width) / 2);
  box-sizing: border-box;
  border-radius: 999vw;
  overflow: clip;
  background: linear-gradient(
    var(--angle-2),
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.5) 40% 50%,
    rgba(255,255,255,0) 55%
  );
  mix-blend-mode: screen;
  pointer-events: none;
  background-size: 200% 200%;
  background-position: 0% 50%;
  transition:
    background-position calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease),
    --angle-2 calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease);
}

.enter-btn:hover span::after { background-position: 25% 50%; }
.enter-btn:active span::after { background-position: 50% 15%; --angle-2: -15deg; }

.enter-btn::after {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0;
  border-radius: 999vw;
  width: calc(100% + var(--border-width));
  height: calc(100% + var(--border-width));
  top: calc(0% - var(--border-width) / 2);
  left: calc(0% - var(--border-width) / 2);
  padding: var(--border-width);
  box-sizing: border-box;
  background: conic-gradient(
    from var(--angle-1) at 50% 50%,
    rgba(255,255,255,0.6),
    rgba(255,255,255,0) 5% 40%,
    rgba(255,255,255,0.6) 50%,
    rgba(255,255,255,0) 60% 95%,
    rgba(255,255,255,0.6)
  ),
  linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.4));
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  transition: all var(--anim--hover-time) var(--anim--hover-ease), --angle-1 500ms ease;
  box-shadow: inset 0 0 0 calc(var(--border-width) / 2) rgba(255,255,255,0.4);
}

.enter-btn:hover::after { --angle-1: -125deg; }
.enter-btn:active::after { --angle-1: -75deg; }

.button-wrap:has(.enter-btn:hover) .button-shadow {
  filter: blur(clamp(2px, 0.0625em, 6px));
}

.button-wrap:has(.enter-btn:hover) .button-shadow::after {
  top: calc(var(--shadow-cuttoff-fix) - 0.875em);
}

.button-wrap:has(.enter-btn:active) {
  transform: rotate3d(1, 0, 0, 25deg);
}

.button-wrap:has(.enter-btn:active) .enter-btn {
  box-shadow:
    inset 0 0.125em 0.125em rgba(0,0,0,0.08),
    inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
    0 0.125em 0.125em -0.125em rgba(0,0,0,0.2),
    0 0 0.1em 0.25em inset rgba(255,255,255,0.2),
    0 0.225em 0.05em 0 rgba(0,0,0,0.08),
    0 0.25em 0 0 rgba(255,255,255,0.5),
    inset 0 0.25em 0.05em 0 rgba(0,0,0,0.2);
}

/* ── FADE OUT ─────────────────────────────────── */
@keyframes fadeOut {
  to { opacity: 0; }
}
.fading {
  animation: fadeOut 0.55s ease forwards;
}

</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div class="hero">
    <p class="welcome-text">Welcome to</p>
    <h1 class="hero-name">Dr. Ankit Malik</h1>
    <p class="hero-sub">AM · 369 · Network</p>

    <!-- Premium glass button -->
    <div class="button-wrap">
      <button class="enter-btn" id="enterBtn">
        <span>Press here to enter</span>
      </button>
      <div class="button-shadow"></div>
    </div>
  </div>
</div>

<script type="module">
import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js"

const app = TubesCursor(document.getElementById('canvas'), {
  tubes: {
    colors: ["#f967fb", "#53bc28", "#6958d5"],
    lights: {
      intensity: 200,
      colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
    }
  }
})

function randomColors(n) {
  return Array.from({length: n}, () =>
    "#" + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0')
  )
}

// Button click → randomize colors + redirect
const enterBtn = document.getElementById('enterBtn')
const appEl    = document.getElementById('app')

enterBtn.addEventListener('click', (e) => {
  e.stopPropagation()
  // Randomize tubes on click
  app.tubes.setColors(randomColors(3))
  app.tubes.setLightsColors(randomColors(4))
  // Fade out and redirect
  appEl.classList.add('fading')
  setTimeout(() => {
    window.location.href = 'links.html'
  }, 560)
})

// Background click → only randomize colors, no redirect
document.body.addEventListener('click', (e) => {
  if (e.target !== enterBtn && !enterBtn.contains(e.target)) {
    app.tubes.setColors(randomColors(3))
    app.tubes.setLightsColors(randomColors(4))
  }
})
</script>
</body>
</html>

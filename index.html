<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM-369-Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --angle-1{syntax:"<angle>";inherits:false;initial-value:-75deg;}
@property --angle-2{syntax:"<angle>";inherits:false;initial-value:-45deg;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased;}

#fireCanvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;}

#vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 90% 80% at 50% 110%,
    transparent 0%,rgba(0,0,0,0.22) 45%,rgba(0,0,0,0.75) 100%);
}

.hero{
  position:relative;z-index:10;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;padding:24px;text-align:center;
  pointer-events:none;
}

@keyframes flameRise{
  0%  {opacity:0;  transform:translateY(60px) scaleX(1.1) scaleY(0.7);}
  30% {opacity:0.6;transform:translateY(14px) scaleX(1.03) scaleY(1.06);}
  62% {opacity:0.92;transform:translateY(-4px) scaleX(1) scaleY(1.02);}
  80% {opacity:1;  transform:translateY(2px) scaleX(1) scaleY(1);}
  100%{opacity:1;  transform:translateY(0) scaleX(1) scaleY(1);}
}


@keyframes subtleGlow{
  0%,100%{opacity:0.65;}
  50%{opacity:0.88;}
}
@keyframes btnAppear{
  0%  {opacity:0;  transform:translateY(28px) scale(0.88);}
  62% {opacity:0.85;transform:translateY(-4px) scale(1.02);}
  100%{opacity:1;  transform:translateY(0) scale(1);}
}

.welcome-line{
  font-size:clamp(14px,5.5vw,38px);font-weight:700;
  letter-spacing:clamp(2px,1.2vw,6px);text-transform:uppercase;
  white-space:nowrap;color:rgba(255,200,100,0.85);
  margin-bottom:6px;display:block;opacity:0;
  will-change:transform,opacity;
  animation:flameRise 1.1s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
  text-shadow:0 0 22px rgba(255,110,0,0.75),0 0 55px rgba(255,50,0,0.3);
}
.main-title{
  font-size:clamp(14px,5.5vw,38px);font-weight:800;
  text-transform:uppercase;letter-spacing:clamp(2px,1.2vw,6px);
  line-height:1.1;white-space:nowrap;color:#fff;
  margin-bottom:8px;display:block;opacity:0;
  will-change:transform,opacity;
  animation:flameRise 1.2s cubic-bezier(0.22,1,0.36,1) 0.65s forwards;
  text-shadow:0 0 18px rgba(255,140,0,1),0 0 42px rgba(255,60,0,0.7),0 0 90px rgba(255,20,0,0.3);
}
.subtitle{
  font-size:clamp(9px,2.6vw,13px);font-weight:400;
  letter-spacing:clamp(1px,0.8vw,2.5px);text-transform:uppercase;
  font-style:italic;white-space:nowrap;color:rgba(255,175,70,0.65);
  text-shadow:0 0 18px rgba(255,80,0,0.5);
  margin-bottom:40px;display:block;opacity:0;
  animation:flameRise 1.0s cubic-bezier(0.22,1,0.36,1) 1.1s forwards,
            subtleGlow 3.5s ease-in-out 2.1s infinite;
}

:root{--global--size:clamp(0.88rem,2.1vw,1.18rem);--anim--hover-time:400ms;--anim--hover-ease:cubic-bezier(0.25,1,0.5,1);}
.button-wrap{
  position:relative;border-radius:999vw;
  pointer-events:auto;
  transition:all var(--anim--hover-time) var(--anim--hover-ease);
  font-size:var(--global--size);opacity:0;
  animation:btnAppear 1.0s cubic-bezier(0.22,1,0.36,1) 1.55s forwards;
}
.button-shadow{
  --shadow-cuttoff-fix:2em;
  position:absolute;
  width:calc(100% + var(--shadow-cuttoff-fix));height:calc(100% + var(--shadow-cuttoff-fix));
  top:calc(0% - var(--shadow-cuttoff-fix)/2);left:calc(0% - var(--shadow-cuttoff-fix)/2);
  filter:blur(clamp(2px,0.125em,12px));overflow:visible;pointer-events:none;
  /* Hidden on mobile — blur filter expensive with canvas behind */
}
@media (max-width:768px){.button-shadow{display:none;}}
.button-shadow::after{
  content:"";position:absolute;border-radius:999vw;
  background:linear-gradient(180deg,rgba(255,80,0,0.3),rgba(200,30,0,0.15));
  width:calc(100% - var(--shadow-cuttoff-fix) - 0.25em);height:calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
  top:calc(var(--shadow-cuttoff-fix) - 0.5em);left:calc(var(--shadow-cuttoff-fix) - 0.875em);
  padding:0.125em;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;transition:all var(--anim--hover-time) var(--anim--hover-ease);
}
.enter-btn{
  --border-width:clamp(1px,0.0625em,4px);
  all:unset;cursor:pointer;position:relative;
  -webkit-tap-highlight-color:rgba(0,0,0,0);pointer-events:auto;z-index:3;
  background:linear-gradient(-75deg,rgba(255,255,255,0.06),rgba(255,255,255,0.18),rgba(255,255,255,0.06));
  border-radius:999vw;
  box-shadow:inset 0 0.125em 0.125em rgba(0,0,0,0.1),inset 0 -0.125em 0.125em rgba(255,255,255,0.4),
    0 0.25em 0.125em -0.125em rgba(0,0,0,0.4),0 0 0.1em 0.25em inset rgba(255,255,255,0.15);
  /* backdrop-filter removed — too expensive on mobile with canvas behind */
  transition:all var(--anim--hover-time) var(--anim--hover-ease);
}
.enter-btn:hover{
  transform:scale(0.975);
  box-shadow:inset 0 0.125em 0.125em rgba(0,0,0,0.08),inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
    0 0.15em 0.05em -0.1em rgba(0,0,0,0.35),0 0 0.05em 0.1em inset rgba(255,255,255,0.4);
}
.enter-btn span{
  position:relative;display:block;user-select:none;
  font-family:"Montserrat",sans-serif;letter-spacing:0.12em;font-weight:600;font-size:1em;
  color:rgba(255,255,255,0.95);
  text-shadow:0 0 14px rgba(255,100,0,0.6),0 0.1em 0.2em rgba(0,0,0,0.5);
  transition:all var(--anim--hover-time) var(--anim--hover-ease);
  padding-inline:2.2em;padding-block:0.9em;
}
.enter-btn span::after{
  content:"";display:block;position:absolute;z-index:3;
  width:calc(100% - var(--border-width));height:calc(100% - var(--border-width));
  top:calc(0% + var(--border-width)/2);left:calc(0% + var(--border-width)/2);
  box-sizing:border-box;border-radius:999vw;overflow:clip;
  background:linear-gradient(var(--angle-2),rgba(255,255,255,0) 0%,rgba(255,255,255,0.45) 40% 50%,rgba(255,255,255,0) 55%);
  mix-blend-mode:screen;pointer-events:none;
  background-size:200% 200%;background-position:0% 50%;
  transition:background-position calc(var(--anim--hover-time)*1.25) var(--anim--hover-ease),
    --angle-2 calc(var(--anim--hover-time)*1.25) var(--anim--hover-ease);
}
.enter-btn:hover span::after{background-position:25% 50%;}
.enter-btn:active span::after{background-position:50% 15%;--angle-2:-15deg;}
.enter-btn::after{
  content:"";position:absolute;z-index:1;inset:0;border-radius:999vw;
  width:calc(100% + var(--border-width));height:calc(100% + var(--border-width));
  top:calc(0% - var(--border-width)/2);left:calc(0% - var(--border-width)/2);
  padding:var(--border-width);box-sizing:border-box;
  background:conic-gradient(from var(--angle-1) at 50% 50%,
    rgba(255,150,50,0.85),rgba(255,150,50,0) 5% 40%,
    rgba(255,150,50,0.85) 50%,rgba(255,150,50,0) 60% 95%,rgba(255,150,50,0.85)),
  linear-gradient(180deg,rgba(255,120,30,0.4),rgba(255,80,0,0.4));
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  transition:all var(--anim--hover-time) var(--anim--hover-ease),--angle-1 500ms ease;
}
.enter-btn:hover::after{--angle-1:-125deg;}
.enter-btn:active::after{--angle-1:-75deg;}
.button-wrap:has(.enter-btn:active){transform:rotate3d(1,0,0,25deg);}
.button-wrap:has(.enter-btn:hover) .button-shadow{filter:blur(clamp(2px,0.0625em,6px));}
</style>
</head>
<body>
<canvas id="fireCanvas"></canvas>
<div id="vignette"></div>

<div class="hero">
  <p class="welcome-line">Welcome to</p>
  <h1 class="main-title">AM-369-Network</h1>
  <p class="subtitle">Designed by Dr. Ankit Malik</p>
  <div class="button-wrap">
    <button class="enter-btn" id="enterBtn"><span>Press here to enter</span></button>
    <div class="button-shadow"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════
// PERLIN NOISE
// ═══════════════════════════════════
const Perlin=(()=>{
  const perm=new Uint8Array(512),p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  const lerp=(a,b,t)=>a+t*(b-a);
  const grad=(h,x,y)=>{const u=h<2?x:y,v=h<2?y:x;return((h&1)?-u:u)+((h&2)?-v:v);};
  return{noise(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    x-=Math.floor(x);y-=Math.floor(y);
    const u=fade(x),v=fade(y),a=perm[X]+Y,b=perm[X+1]+Y;
    return lerp(lerp(grad(perm[a],x,y),grad(perm[b],x-1,y),u),
      lerp(grad(perm[a+1],x,y-1),grad(perm[b+1],x-1,y-1),u),v);
  }};
})();

// ═══════════════════════════════════
// DEVICE TIER — auto quality
// ═══════════════════════════════════
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const QUALITY  = isMobile ? 'low' : 'high';

// ═══════════════════════════════════
// CANVAS
// ═══════════════════════════════════
const fc  = document.getElementById('fireCanvas');
const ctx = fc.getContext('2d', {alpha:false, desynchronized:true});
let W, H;
function resize(){
  W = fc.width  = window.innerWidth;
  H = fc.height = window.innerHeight;
  if(typeof _fuels !== 'undefined') buildFuels();
  if(typeof sprites !== 'undefined') buildSprites();
  _groundGrad = null;
}

// ═══════════════════════════════════
// 22 PALETTES
// ═══════════════════════════════════
const PALS=[
  [[255,255,220],[255,240,80],[255,140,0],[220,40,0],[120,10,0]],
  [[220,240,255],[80,180,255],[0,100,255],[0,30,180],[0,0,80]],
  [[220,255,180],[160,255,20],[40,200,0],[0,120,0],[0,50,0]],
  [[255,220,255],[255,100,240],[200,0,220],[120,0,160],[50,0,70]],
  [[255,255,200],[255,230,60],[230,150,0],[180,80,0],[90,30,0]],
  [[255,220,220],[255,140,140],[255,0,60],[180,0,30],[80,0,15]],
  [[200,255,255],[0,240,230],[0,180,200],[0,100,150],[0,40,70]],
  [[255,255,180],[255,220,0],[255,100,0],[200,30,0],[90,10,0]],
  [[240,220,255],[180,80,255],[100,0,255],[50,0,180],[20,0,80]],
  [[255,255,255],[255,220,80],[255,120,0],[220,40,0],[120,10,0]],
  [[255,255,255],[180,240,255],[80,200,255],[20,100,220],[0,30,120]],
  [[255,220,160],[255,100,30],[200,20,0],[120,0,0],[50,0,0]],
  [[255,255,200],[220,255,0],[150,240,0],[60,180,0],[10,80,0]],
  [[255,200,255],[255,60,220],[180,0,200],[100,0,160],[40,0,80]],
  [[255,240,180],[255,160,20],[200,60,0],[140,20,0],[60,5,0]],
  [[200,255,240],[60,255,180],[0,200,150],[0,120,100],[0,50,60]],
  [[220,255,200],[80,255,80],[0,200,40],[0,130,20],[0,60,10]],
  [[255,200,220],[255,80,160],[220,0,100],[150,0,60],[70,0,25]],
  [[255,230,180],[220,150,40],[180,90,10],[120,50,0],[60,20,0]],
  [[220,180,255],[140,60,255],[80,0,200],[40,0,120],[15,0,60]],
  [[200,255,220],[40,240,160],[0,180,120],[0,100,80],[0,40,50]],
  [[255,255,255],[220,220,255],[160,160,220],[100,100,180],[40,40,100]],
];
let curPI=Math.floor(Math.random()*PALS.length), nxtPI=curPI, blend=1.0;
let wPal=PALS[curPI].map(c=>[...c]);

function schedPal(){
  setTimeout(()=>{
    let n; do{n=Math.floor(Math.random()*PALS.length);}while(n===curPI);
    nxtPI=n; blend=0; schedPal();
  }, 2200+Math.random()*1600);
}
schedPal();

function tickPal(){
  if(blend>=1) return;
  blend=Math.min(1,blend+0.025);
  const a=PALS[curPI], b=PALS[nxtPI];
  for(let i=0;i<5;i++){
    wPal[i][0]=Math.round(a[i][0]+(b[i][0]-a[i][0])*blend);
    wPal[i][1]=Math.round(a[i][1]+(b[i][1]-a[i][1])*blend);
    wPal[i][2]=Math.round(a[i][2]+(b[i][2]-a[i][2])*blend);
  }
  if(blend>=1){ curPI=nxtPI; buildSprites(); _groundGrad=null; }
}

// ═══════════════════════════════════
// PRE-BAKED SPRITES — one per layer
// Built once, reused every frame via drawImage
// ═══════════════════════════════════
const SZ = 128;
const sprites = {};

function makeOC(size){
  if(typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(size,size);
  const c=document.createElement('canvas'); c.width=c.height=size; return c;
}

function buildSprite(c0,c1,c2,c3){
  const oc=makeOC(SZ), c=oc.getContext('2d');
  const g=c.createRadialGradient(SZ/2,SZ/2,0,SZ/2,SZ/2,SZ/2);
  g.addColorStop(0,   `rgba(${c0[0]},${c0[1]},${c0[2]},1)`);
  g.addColorStop(0.35,`rgba(${c1[0]},${c1[1]},${c1[2]},0.75)`);
  g.addColorStop(0.65,`rgba(${c2[0]},${c2[1]},${c2[2]},0.35)`);
  g.addColorStop(0.85,`rgba(${c3[0]},${c3[1]},${c3[2]},0.10)`);
  g.addColorStop(1,   'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(0,0,SZ,SZ);
  return oc;
}

function buildSmokeSprite(){
  const oc=makeOC(SZ), c=oc.getContext('2d');
  const g=c.createRadialGradient(SZ/2,SZ/2,0,SZ/2,SZ/2,SZ/2);
  g.addColorStop(0,  'rgba(28,18,10,0.9)');
  g.addColorStop(0.5,'rgba(18,10,5,0.35)');
  g.addColorStop(1,  'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(0,0,SZ,SZ);
  return oc;
}

function buildSprites(){
  sprites.core  = buildSprite(wPal[0],wPal[1],wPal[2],wPal[3]);
  sprites.inner = buildSprite(wPal[1],wPal[2],wPal[3],wPal[4]);
  sprites.mid   = buildSprite(wPal[2],wPal[3],wPal[4],wPal[4]);
  sprites.outer = buildSprite(wPal[3],wPal[4],wPal[4],[0,0,0]);
  sprites.smoke = buildSmokeSprite();
}

// ═══════════════════════════════════
// GLOBAL FLICKER
// ═══════════════════════════════════
let gFlick=1, fTgt=1, fTmr=0;
function tickFlick(){
  if(++fTmr%8===0) fTgt=0.78+Math.random()*0.28;
  gFlick+=(fTgt-gFlick)*0.12;
}

// ═══════════════════════════════════
// FUEL POINTS — cached
// ═══════════════════════════════════
let _fuels=[];
function buildFuels(){
  _fuels=[]; const N=7;
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    _fuels.push({x:W*(0.08+t*0.84), y:H, iv:0.55+Math.sin(t*Math.PI)*0.45});
  }
}

// ═══════════════════════════════════
// PARTICLE COUNTS — adaptive quality
// ═══════════════════════════════════
const LC = QUALITY==='low'
  ? [55, 95, 105, 75, 28, 35]   // mobile:  393 total
  : [90, 155, 175, 125, 48, 52]; // desktop: 645 total
const TOTAL = LC.reduce((a,b)=>a+b,0);

// Typed Float32 arrays — cache friendly, no GC pressure
const px   = new Float32Array(TOTAL);
const py   = new Float32Array(TOTAL);
const pvx  = new Float32Array(TOTAL);
const pvy  = new Float32Array(TOTAL);
const psz  = new Float32Array(TOTAL);
const plife= new Float32Array(TOTAL);
const pml  = new Float32Array(TOTAL);
const pox  = new Float32Array(TOTAL);
const poy  = new Float32Array(TOTAL);
const pgrav= new Float32Array(TOTAL);
const play = new Uint8Array(TOTAL);
let noiseT = 0;

function resetP(i, init){
  const ly=play[i];
  const f=_fuels[Math.floor(Math.random()*_fuels.length)];
  const iv=f.iv;
  if(ly===0){
    px[i]=f.x+(Math.random()-.5)*W*.045; py[i]=init?H*(.72+Math.random()*.28):H+4;
    pvx[i]=(Math.random()-.5)*.4; pvy[i]=-(3.2+Math.random()*2.8)*iv;
    psz[i]=3+Math.random()*8; plife[i]=init?Math.random()*45:0; pml[i]=38+Math.random()*32;
  }else if(ly===1){
    px[i]=f.x+(Math.random()-.5)*W*.08; py[i]=init?H*(.62+Math.random()*.38):H+6;
    pvx[i]=(Math.random()-.5)*.7; pvy[i]=-(2.6+Math.random()*2.4)*iv;
    psz[i]=7+Math.random()*13; plife[i]=init?Math.random()*55:0; pml[i]=50+Math.random()*46;
  }else if(ly===2){
    px[i]=f.x+(Math.random()-.5)*W*.13; py[i]=init?H*(.52+Math.random()*.48):H+8;
    pvx[i]=(Math.random()-.5)*1.1; pvy[i]=-(1.9+Math.random()*2.1)*iv;
    psz[i]=11+Math.random()*19; plife[i]=init?Math.random()*65:0; pml[i]=60+Math.random()*58;
  }else if(ly===3){
    px[i]=f.x+(Math.random()-.5)*W*.2; py[i]=init?H*(.44+Math.random()*.56):H+10;
    pvx[i]=(Math.random()-.5)*1.7; pvy[i]=-(1.3+Math.random()*1.7)*iv;
    psz[i]=14+Math.random()*26; plife[i]=init?Math.random()*75:0; pml[i]=75+Math.random()*72;
  }else if(ly===4){
    px[i]=f.x+(Math.random()-.5)*W*.09; py[i]=init?H*(.35+Math.random()*.55):H*.58;
    pvx[i]=(Math.random()-.5)*4.5; pvy[i]=-(2.8+Math.random()*5.2);
    psz[i]=1.0+Math.random()*2.2; plife[i]=init?Math.random()*42:0; pml[i]=28+Math.random()*52;
    pgrav[i]=.032+Math.random()*.04;
  }else{
    px[i]=f.x+(Math.random()-.5)*W*.24; py[i]=init?H*(.08+Math.random()*.42):H*.4+Math.random()*48;
    pvx[i]=(Math.random()-.5)*.6; pvy[i]=-(0.3+Math.random()*.65);
    psz[i]=18+Math.random()*42; plife[i]=init?Math.random()*95:0; pml[i]=88+Math.random()*88;
  }
  pox[i]=Math.random()*200; poy[i]=Math.random()*200;
}

// Init
// particles initialised below after buildFuels()

// ═══════════════════════════════════
// UPDATE — tight loop, no method calls
// ═══════════════════════════════════
// On mobile: skip noise every other frame to halve CPU
let frameCount=0;
let _nx=new Float32Array(TOTAL), _ny=new Float32Array(TOTAL);

function updateAll(){
  frameCount++;
  const doNoise = QUALITY==='high' || (frameCount%2===0);

  for(let i=0;i<TOTAL;i++){
    plife[i]++;
    if(plife[i]>=pml[i]){ resetP(i,false); continue; }

    const ly=play[i];
    let nx,ny;
    if(doNoise){
      nx=Perlin.noise(px[i]*.003+pox[i], noiseT*.45+poy[i]);
      ny=Perlin.noise(px[i]*.003+pox[i]+50, noiseT*.38+poy[i]);
      _nx[i]=nx; _ny[i]=ny;
    }else{
      nx=_nx[i]; ny=_ny[i];
    }
    const wind=Math.sin(noiseT*.32+px[i]*.002)*.18;

    if(ly===0){
      pvx[i]+=nx*.28+wind*.32; pvy[i]+=ny*.07-.018;
      pvx[i]*=.935; pvy[i]*=.981; px[i]+=pvx[i]; py[i]+=pvy[i]*gFlick;
    }else if(ly===1){
      pvx[i]+=nx*.44+wind*.48; pvy[i]+=ny*.10;
      pvx[i]*=.952; pvy[i]*=.983; px[i]+=pvx[i]; py[i]+=pvy[i]*gFlick;
    }else if(ly===2){
      pvx[i]+=nx*.62+wind*.68; pvy[i]+=ny*.13;
      pvx[i]*=.960; pvy[i]*=.985; px[i]+=pvx[i]; py[i]+=pvy[i]*gFlick;
    }else if(ly===3){
      pvx[i]+=nx*.82+wind*.88; pvy[i]+=ny*.17;
      pvx[i]*=.968; pvy[i]*=.987; px[i]+=pvx[i]; py[i]+=pvy[i]*gFlick;
    }else if(ly===4){
      pvx[i]+=nx*.18+wind*.55; pvy[i]+=pgrav[i];
      pvx[i]*=.991; px[i]+=pvx[i]; py[i]+=pvy[i];
    }else{
      pvx[i]+=nx*.18+wind*1.2; pvy[i]+=ny*.04;
      pvx[i]*=.981; pvy[i]*=.992; px[i]+=pvx[i]; py[i]+=pvy[i];
    }
  }
}

// ═══════════════════════════════════
// DRAW — sprite drawImage, batched by layer
// No createRadialGradient in hot loop
// ═══════════════════════════════════
function drawLayer(ly, sprite, scaleY){
  ctx.globalCompositeOperation = ly<=3 ? 'screen' : 'source-over';
  for(let i=0;i<TOTAL;i++){
    if(play[i]!==ly) continue;
    if(px[i]<-80||px[i]>W+80||py[i]<-80) continue;
    const p=plife[i]/pml[i];
    let a;
    if(ly===0)      a=p<.10?p/.10:Math.max(0,1-(p-.10)/.90);
    else if(ly===1) a=p<.12?p/.12:Math.max(0,1-(p-.12)/.88);
    else if(ly===2) a=p<.14?p/.14:Math.max(0,1-(p-.14)/.86);
    else if(ly===3) a=p<.18?p/.18:Math.max(0,1-(p-.18)/.82);
    else if(ly===4) a=Math.max(0,1-p*1.1);
    else            a=p<.2?p/.2*.14:Math.max(0,(1-p)*.14);
    if(a<.008) continue;

    const sz=psz[i]*gFlick;
    ctx.globalAlpha=a;
    if(ly<=3){
      ctx.save();
      ctx.translate(px[i],py[i]);
      ctx.scale(1, scaleY);
      ctx.drawImage(sprite,-sz,-sz,sz*2,sz*2);
      ctx.restore();
    }else if(ly===4){
      const flk=.65+Math.sin(plife[i]*.85+pox[i])*.35;
      ctx.globalAlpha=a*flk;
      ctx.drawImage(sprite,px[i]-sz,py[i]-sz,sz*2,sz*2);
    }else{
      ctx.drawImage(sprites.smoke,px[i]-sz,py[i]-sz,sz*2,sz*2);
    }
  }
}

// ═══════════════════════════════════
// GROUND GLOW — cached gradient
// ═══════════════════════════════════
let _groundGrad=null, _groundW=0;
function drawGround(){
  if(!_groundGrad||_groundW!==W){
    const[r,g,b]=wPal[2];
    _groundGrad=ctx.createRadialGradient(W/2,H,0,W/2,H,W*.65);
    _groundGrad.addColorStop(0,  `rgba(${r},${g},${b},1)`);
    _groundGrad.addColorStop(.4, `rgba(${Math.floor(r*.45)},${Math.floor(g*.26)},0,0.5)`);
    _groundGrad.addColorStop(1,  'rgba(0,0,0,0)');
    _groundW=W;
  }
  const f=.08+Math.abs(Perlin.noise(noiseT*2.0,77))*.11;
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=f*gFlick;
  ctx.fillStyle=_groundGrad;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
}

// ═══════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════
// ── Init after all declarations ──
W = fc.width  = window.innerWidth;
H = fc.height = window.innerHeight;
buildFuels();
buildSprites();
// Init particles AFTER fuels are built
let idx=0;
for(let ly=0;ly<6;ly++) for(let k=0;k<LC[ly];k++){ play[idx]=ly; resetP(idx,true); idx++; }
window.addEventListener('resize', resize);

let running=true;
function loop(){
  if(!running) return;
  noiseT+=.012; tickFlick(); tickPal();

  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,W,H);

  drawGround();
  updateAll();

  drawLayer(5, sprites.smoke, 1);
  drawLayer(3, sprites.outer, 1.7);
  drawLayer(2, sprites.mid,   1.55);
  drawLayer(1, sprites.inner, 1.42);
  drawLayer(0, sprites.core,  1.28);
  drawLayer(4, sprites.core,  1);

  requestAnimationFrame(loop);
}
loop();

// ═══════════════════════════════════
// EXIT — surge + flash
// ═══════════════════════════════════
// Free GPU layers after entry animations finish (~2.8s)
setTimeout(()=>{
  document.querySelectorAll('.welcome-line,.main-title,.subtitle,.button-wrap')
    .forEach(el=>el.style.willChange='auto');
}, 2800);

document.getElementById('enterBtn').addEventListener('click', e=>{
  e.stopPropagation();
  for(let i=0;i<TOTAL;i++){
    if(play[i]<=2){ pvy[i]*=2.4; psz[i]*=1.4; }
    if(play[i]===4){ pvy[i]*=2.8; pvx[i]*=1.6; }
  }
  const flash=document.createElement('div');
  flash.style.cssText=`position:fixed;inset:0;z-index:300;pointer-events:none;
    background:radial-gradient(ellipse 75% 55% at 50% 100%,
      rgba(255,235,80,.92) 0%,rgba(255,100,0,.88) 28%,
      rgba(160,15,0,.82) 58%,rgba(0,0,0,0) 100%);
    opacity:0;transition:opacity .18s ease;`;
  document.body.appendChild(flash);
  requestAnimationFrame(()=>{
    flash.style.opacity='1';
    setTimeout(()=>{
      running=false;
      flash.style.transition='opacity .5s ease';
      flash.style.background='#000';
      flash.style.opacity='1';
      setTimeout(()=>{ window.location.href='links.html'; },520);
    },180);
  });
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM-369-Network</title>
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}
body, html, #app {
  width: 100%; height: 100%;
}
body {
  touch-action: none;
  background: #0a0805;
  overflow: hidden;
}
#app {
  height: 100%;
  position: relative;
}
#canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.hero {
  position: relative;
  z-index: 10;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
}
.hero-dr {
  font-family: "Montserrat", sans-serif;
  font-size: clamp(12px, 3vw, 16px);
  font-weight: 400;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  text-shadow: 0 0 30px rgba(0,0,0,0.9);
}
.hero-name {
  font-family: "Montserrat", sans-serif;
  font-size: clamp(38px, 10vw, 74px);
  font-weight: 700;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 0 40px rgba(0,0,0,1), 0 0 80px rgba(0,0,0,0.5);
  line-height: 1;
  text-align: center;
  letter-spacing: 3px;
}
.hero-sub {
  font-family: "Montserrat", sans-serif;
  font-size: clamp(18px, 5vw, 28px);
  font-weight: 600;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  text-shadow: 0 0 20px rgba(0,0,0,1);
  margin-top: 2px;
}
#timer-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: 28px;
}
#timer {
  font-family: "Montserrat", sans-serif;
  font-size: clamp(48px, 14vw, 90px);
  font-weight: 700;
  color: #fff;
  text-shadow: 0 0 30px rgba(0,0,0,1), 0 0 60px rgba(0,0,0,0.4);
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
#timer-label {
  font-family: "Montserrat", sans-serif;
  font-size: clamp(8px, 1.8vw, 11px);
  font-weight: 600;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-shadow: 0 0 20px rgba(0,0,0,1);
}
#progress-wrap {
  width: clamp(100px, 28vw, 180px);
  height: 2px;
  background: rgba(255,255,255,0.10);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 2px;
}
#progress-bar {
  height: 100%;
  width: 100%;
  background: rgba(255,255,255,0.65);
  border-radius: 2px;
  transform-origin: left;
  transform: scaleX(1);
  transition: transform 6s linear;
}
@keyframes fadeOut {
  to { opacity: 0; }
}
.fading {
  animation: fadeOut 0.55s ease forwards;
}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div class="hero">
    <h1 class="hero-name">Dr. Ankit Malik</h1>
    <p class="hero-sub">AM · 369 · Network</p>
    <div id="timer-wrap">
      <div id="timer">6</div>
      <div id="timer-label">Entering in</div>
      <div id="progress-wrap">
        <div id="progress-bar"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js"

const app = TubesCursor(document.getElementById('canvas'), {
  tubes: {
    colors: ["#f967fb", "#53bc28", "#6958d5"],
    lights: {
      intensity: 200,
      colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
    }
  }
})

// Tap to randomize colors
document.body.addEventListener('click', () => {
  app.tubes.setColors(randomColors(3))
  app.tubes.setLightsColors(randomColors(4))
})

function randomColors(n) {
  return Array.from({length: n}, () =>
    "#" + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0')
  )
}

// ── 6-second countdown → redirect ─────────────────────────────
const timerEl = document.getElementById('timer')
const barEl   = document.getElementById('progress-bar')
const appEl   = document.getElementById('app')

let seconds = 6

// Kick off progress bar shrink
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    barEl.style.transform = 'scaleX(0)'
  })
})

const tick = setInterval(() => {
  seconds--
  timerEl.textContent = seconds

  if (seconds <= 0) {
    clearInterval(tick)
    appEl.classList.add('fading')
    setTimeout(() => {
      window.location.href = 'links.html'
    }, 560)
  }
}, 1000)
</script>
</body>
</html>
